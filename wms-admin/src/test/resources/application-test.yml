# test profile (test classpath only; not shipped in the app jar).
#
# Tests run against a DEDICATED test database (wms_system_test), never the default dev DB. Individual
# test classes may still set their own spring.datasource.url via @SpringBootTest(properties=...); those
# also point at wms_system_test, so isolation holds either way.
#
# baseline-on-migrate is explicitly false: the test DB is expected to be either empty (Flyway runs
# V1/V2/V3 from scratch) or already Flyway-managed (history table present). It is never an existing,
# non-baselined populated schema, so no auto-baseline is wanted here. See docs/database-migration.md
# for how to create the test DB.
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/wms_system_test?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Tokyo&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    baseline-on-migrate: false

  # The `ai` profile is NOT active under test, so the Spring AI chat/embedding models must be disabled:
  # their auto-configuration otherwise activates by default (matchIfMissing) and the DeepSeek model
  # fails the whole context with "API key must be set". The knowledge feature treats VectorStore as
  # optional, so nothing under test needs these beans.
  ai:
    model:
      chat: none
      embedding: none

  # KNOWN, ACCEPTED GAP — not fixed here, documented instead of silently worked around:
  # application.yml (base, always layered under every profile) unconditionally declares
  # spring.config.import: nacos:wms-service.yaml/wms-service-dev.yaml. Confirmed by decompiling
  # NacosConfigDataLocationResolver.isResolvable() (spring-alibaba-nacos-config 2023.0.3.4) that this
  # library has no enabled/disabled switch a lower-precedence profile file (this one) can set to gate
  # whether that import actually runs — every "-Dspring.cloud.nacos.config.enabled=false" /
  # "spring.config.import=" override attempted here was empirically verified to have no effect; the
  # import always resolves. Tests therefore genuinely fetch real, live config from Nacos when it's
  # reachable (as it is in this environment) rather than getting a local/offline default. The only way
  # to actually close this gap is to change how application.yml itself declares the import (e.g. make
  # it optional: / profile-conditional) — out of scope here because that is production config
  # behavior, which this pass is explicitly not allowed to touch. See AiRagAskStreamControllerTest's
  # model-field assertion for the one place this was directly observed and mitigated at the test-code
  # level instead (assert a model value is present, not a specific hardcoded one).

gateway:
  # Must be >= 32 chars: GatewayInternalTokenProperties enforces this even under the test profile
  # (Bean Validation runs at binding time regardless of active profile). Not a real secret.
  internal-token: test-gateway-token-not-a-real-secret

auth-service:
  base-url: http://127.0.0.1:8081/auth
  application-code: WMS

wms:
  auth:
    local-login-enabled: true
    legacy-admin-enabled: true
