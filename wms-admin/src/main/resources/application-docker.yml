server:
  port: 8083
  servlet:
    context-path: /wms

spring:
  application:
    name: wms-service

  cloud:
    nacos:
      discovery:
        enabled: true
        server-addr: ${NACOS_SERVER_ADDR}
        username: ${NACOS_USERNAME}
        password: ${NACOS_PASSWORD}
        service: ${spring.application.name}
        namespace: da3fc902-1db6-43e2-afc5-314500fcbf14
        group: DEFAULT_GROUP
      config:
        server-addr: ${NACOS_SERVER_ADDR}
        username: ${NACOS_USERNAME}
        password: ${NACOS_PASSWORD}
        namespace: da3fc902-1db6-43e2-afc5-314500fcbf14
        group: WMS_GROUP

  config:
    import:
      - nacos:wms-service.yaml?group=WMS_GROUP&refreshEnabled=true
      - nacos:wms-service-dev.yaml?group=WMS_GROUP&refreshEnabled=false

  # Schema is now versioned by Flyway (classpath:db/migration). The old schema.sql/data.sql auto-run
  # is disabled — mode:never — so Spring Boot never executes ad-hoc init SQL again.
  sql:
    init:
      mode: never

  flyway:
    # No explicit url/user/password on purpose: Flyway follows the active profile's spring.datasource,
    # so dev migrates wms_system and test migrates wms_system_test (test isolation). A hardcoded
    # flyway.url would silently migrate that fixed DB regardless of profile.
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    out-of-order: false
    # clean is a destructive "drop everything" operation — permanently disabled so it can never run.
    clean-disabled: true
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: Dev existing schema baseline
    # NOTE: baseline-on-migrate / baseline-version are intentionally NOT set here. Adopting an
    # already-populated database (skipping V1) is a per-environment decision, enabled only in
    # application-dev.yml. An empty database runs V1/V2/V3 from scratch under any profile. Production
    # must set its baseline strategy deliberately after a backup — see docs/database-migration.md.
  jackson:
    time-zone: Asia/Tokyo

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

mybatis-plus:
  global-config:
    db-config:
      id-type: assign_id

springdoc:
  packages-to-scan: com.example.wms.admin.controller
  paths-to-match: /**

knife4j:
  enable: true
  setting:
    language: zh_cn

gateway:
  # Required for direct WMS access protection. Configure the same value in gateway-service forwarding.
  # No fallback default on purpose: GatewayInternalTokenProperties rejects a missing/blank value at
  # startup rather than silently accepting requests using the historical 'local-dev-gateway-token'
  # default that used to be here.
  internal-token: ${GATEWAY_INTERNAL_TOKEN}

auth-service:
  base-url: ${AUTH_SERVICE_BASE_URL:http://auth-service:8081/auth}
  application-code: WMS

wms:
  auth:
    # Deprecated rollback switches only. The default authentication path is Gateway headers plus
    # auth-service /auth/context; do not enable these for normal deployments.
    local-login-enabled: false
    local-jwt-enabled: false
    legacy-admin-enabled: false
  jwt:
    # Deprecated: local WMS JWTs are no longer trusted for protected requests. Kept only so the
    # legacy JwtTokenService can be re-enabled during rollback without code changes.
    secret: ${WMS_JWT_SECRET:wms-system-default-jwt-secret-please-change}
    expire-minutes: ${WMS_JWT_EXPIRE_MINUTES:720}
